<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>QuickQ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

body{
  position:relative;
}

#app{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* 時計 */

#clock{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:22px;
  font-size:17px;
  font-weight:600;
  color:#777;
  letter-spacing:.5px;
  z-index:20;
}

/* 設定 */

#settingsButton{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  right:14px;
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:#151515;
  color:#aaa;
  font-size:27px;
  line-height:52px;
  text-align:center;
  z-index:20;
}

/* =========================
   STARTエリア
========================= */

#startArea{
  position:absolute;

  top:max(
    78px,
    calc(env(safe-area-inset-top) + 62px)
  );

  left:8px;
  right:8px;

  bottom:max(
    245px,
    calc(env(safe-area-inset-bottom) + 220px)
  );

  border:2px solid #444;
  border-radius:18px;

  z-index:5;

  touch-action:manipulation;
}

#startArea::after{
  content:"START";

  position:absolute;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  color:#3f3f3f;

  font-size:12px;
  font-weight:700;
  letter-spacing:3px;

  pointer-events:none;
}

/* =========================
   STOPボタン
========================= */

#stopButton{
  position:absolute;

  left:50%;
  top:24%;

  transform:translateX(-50%);

  min-width:130px;
  height:52px;

  border:2px solid #ff4545;
  border-radius:14px;

  background:#351010;
  color:#ff5555;

  font-size:19px;
  font-weight:800;
  letter-spacing:1px;

  z-index:30;

  touch-action:manipulation;
}

#stopButton:active{
  background:#7a1717;
  color:#fff;
}

/* タイマー */

#timerArea{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#timer{
  font-family:Arial,sans-serif;

  font-size:clamp(
    82px,
    23vw,
    190px
  );

  font-weight:700;
  line-height:1;
  letter-spacing:-0.07em;

  color:#ffffff;

  white-space:nowrap;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  text-align:center;

  pointer-events:none;
}

/* フラッシュ */

#flash{
  position:absolute;
  inset:0;

  background:rgba(255,255,255,.08);

  opacity:0;

  pointer-events:none;

  z-index:50;
}

#flash.active{
  animation:flash .10s ease-out;
}

@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* =========================
   補正
========================= */

#adjustPanel{
  position:absolute;

  left:6%;
  right:6%;

  bottom:max(
    70px,
    calc(env(safe-area-inset-bottom) + 48px)
  );

  z-index:10;
}

#correctionValue{
  text-align:center;

  color:#aaa;

  font-size:24px;
  font-weight:600;

  margin-bottom:12px;
}

.sliderWrap{
  position:relative;

  width:100%;
  height:50px;

  display:flex;
  align-items:center;
}

/* =========================
   10秒ごとの目盛り
========================= */

.tickMark{
  position:absolute;

  top:9px;
  bottom:9px;

  width:2px;

  background:#777;

  transform:translateX(-50%);

  border-radius:2px;

  pointer-events:none;

  z-index:1;
}

/* -20秒 */
.tickM20{
  left:16.6667%;
}

/* -10秒 */
.tickM10{
  left:33.3333%;
}

/* 0秒 */
.tickZero{
  left:50%;

  width:3px;

  top:3px;
  bottom:3px;

  background:#fff;

  opacity:.85;
}

/* +10秒 */
.tickP10{
  left:66.6667%;
}

/* +20秒 */
.tickP20{
  left:83.3333%;
}

#correction{
  position:relative;

  z-index:2;

  width:100%;
  height:6px;

  appearance:none;
  -webkit-appearance:none;

  background:#666;

  border-radius:10px;

  outline:none;
}

#correction::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:42px;
  height:42px;

  border-radius:50%;

  background:#fff;

  border:2px solid #aaa;
}

/* 目盛り数字 */

.sliderLabels{
  position:relative;

  height:30px;

  margin-top:2px;

  color:#666;

  font-size:14px;
}

.sliderLabels span{
  position:absolute;

  transform:translateX(-50%);
}

.sliderLabels .m30{
  left:0;
  transform:none;
}

.sliderLabels .m20{
  left:16.6667%;
}

.sliderLabels .m10{
  left:33.3333%;
}

.sliderLabels .zero{
  left:50%;

  color:#aaa;
  font-weight:800;
}

.sliderLabels .p10{
  left:66.6667%;
}

.sliderLabels .p20{
  left:83.3333%;
}

.sliderLabels .p30{
  right:0;
  transform:none;
}

/* =========================
   設定画面
========================= */

#settings{
  position:absolute;
  inset:0;

  background:rgba(0,0,0,.97);

  z-index:100;

  display:none;
  overflow:auto;

  padding:
    max(28px,env(safe-area-inset-top))
    22px
    max(30px,env(safe-area-inset-bottom));
}

#settings.open{
  display:block;
}

.settingsHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.settingsTitle{
  font-size:26px;
  font-weight:700;
}

#closeSettings{
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:28px;
}

.settingGroup{
  margin-bottom:28px;
}

.settingLabel{
  color:#999;
  font-size:15px;
  margin-bottom:10px;
}

.settingValue{
  color:#fff;
  font-size:20px;
  font-weight:600;
  margin-bottom:8px;
}

.settingRange{
  width:100%;
  height:6px;

  appearance:none;
  -webkit-appearance:none;

  background:#555;

  border-radius:8px;
}

.settingRange::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:34px;
  height:34px;

  border-radius:50%;

  background:#fff;
}

.fontGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.fontButton{
  min-height:56px;
  border:1px solid #333;
  border-radius:14px;
  background:#111;
  color:#bbb;
  font-size:18px;
}

.fontButton.selected{
  border:2px solid #fff;
  color:#fff;
  background:#222;
}

.colorGrid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.colorButton{
  width:52px;
  height:52px;
  border-radius:50%;
  border:3px solid transparent;
}

.colorButton.selected{
  border-color:#fff;
  transform:scale(1.12);
}

.white{background:#ffffff;}
.green{background:#39ff88;}
.red{background:#ff4b4b;}
.yellow{background:#ffe04b;}
.blue{background:#55aaff;}
.orange{background:#ff963f;}
.cyan{background:#45f4ff;}

#preview{
  margin-top:30px;
  padding:24px 5px;

  border-top:1px solid #222;
  border-bottom:1px solid #222;

  text-align:center;

  font-size:58px;
  font-weight:700;

  white-space:nowrap;

  font-variant-numeric:tabular-nums;
}

#resetSettings{
  width:100%;
  height:54px;

  margin-top:30px;

  border:1px solid #333;
  border-radius:14px;

  background:#111;
  color:#aaa;

  font-size:17px;
}

</style>
</head>

<body>

<div id="app">

  <div id="clock"></div>

  <button
    id="settingsButton"
    aria-label="設定">
    ⚙︎
  </button>


  <div id="startArea">

    <!-- STOPはSTARTエリア内だが
         イベントを止めるので
         再スタートしない -->

    <button
      id="stopButton"
      type="button">
      ■ STOP
    </button>

    <div id="timerArea">

      <div id="timer">
        00:00.0
      </div>

    </div>

  </div>


  <div id="adjustPanel">

    <div id="correctionValue">
      0.0秒
    </div>

    <div class="sliderWrap">

      <div class="tickMark tickM20"></div>
      <div class="

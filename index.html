<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no,
           viewport-fit=cover"
>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="QuickQ">

<title>QuickQ Timer</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
  overscroll-behavior:none;

  -webkit-user-select:none;
  user-select:none;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  min-height:100dvh;
}

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  background:#000;
}


/* =========================
   上部
========================= */

#top{
  position:absolute;

  top:calc(env(safe-area-inset-top) + 24px);
  left:28px;
  right:28px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  pointer-events:none;
}

#name{
  color:#666;

  font-size:15px;
  font-weight:600;
  letter-spacing:.22em;
}

#clock{
  color:#777;

  font-size:17px;
  font-weight:500;

  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
}


/* =========================
   メインタイマー
========================= */

#timerWrap{
  position:absolute;

  left:0;
  right:0;

  top:42%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;

  pointer-events:none;
}

#timer{
  width:100%;

  text-align:center;

  color:#fff;

  font-size:clamp(86px,23vw,190px);
  font-weight:700;

  line-height:.88;
  letter-spacing:-.075em;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  white-space:nowrap;
}

#status{
  margin-top:34px;

  color:#555;

  font-size:14px;
  font-weight:600;

  letter-spacing:.30em;
}

#status.running{
  color:#fff;
}


/* =========================
   下部
========================= */

#bottom{
  position:absolute;

  left:28px;
  right:28px;

  bottom:calc(env(safe-area-inset-bottom) + 28px);

  z-index:20;
}

#hint{
  margin-bottom:25px;

  text-align:center;

  color:#555;

  font-size:14px;
  font-weight:500;

  letter-spacing:.12em;

  pointer-events:none;
}

#hint strong{
  color:#aaa;
  font-weight:600;
}


/* =========================
   補正
========================= */

#adjustPanel{
  position:relative;

  padding:12px 0 8px;

  background:#000;

  touch-action:none;
}

#adjustLabels{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:9px;

  color:#666;

  font-size:14px;
}

#adjustValue{
  min-width:90px;

  text-align:right;

  color:#999;

  font-size:16px;

  font-variant-numeric:tabular-nums;
}

#slider{
  display:block;

  width:100%;
  height:46px;

  margin:0;

  appearance:none;
  -webkit-appearance:none;

  background:transparent;

  touch-action:none;
}

#slider::-webkit-slider-runnable-track{
  height:4px;

  border-radius:999px;

  background:#555;
}

#slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:36px;
  height:36px;

  margin-top:-16px;

  border:0;
  border-radius:50%;

  background:#fff;
}

#slider::-moz-range-track{
  height:4px;

  border-radius:999px;

  background:#555;
}

#slider::-moz-range-thumb{
  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:#fff;
}


/* =========================
   タップフィードバック
========================= */

#flash{
  position:absolute;
  inset:0;

  z-index:50;

  background:rgba(255,255,255,.11);

  opacity:0;

  pointer-events:none;
}

#flash.on{
  animation:flashTap .14s ease-out;
}

@keyframes flashTap{

  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* =========================
   小さいiPhone
========================= */

@media(max-height:700px){

  #timerWrap{
    top:39%;
  }

  #status{
    margin-top:22px;
  }

  #bottom{
    bottom:calc(env(safe-area-inset-bottom) + 10px);
  }

  #hint{
    margin-bottom:10px;
  }

}

</style>
</head>


<body>

<div id="app">


  <div id="top">

    <div id="name">
      QUICK Q
    </div>

    <div id="clock">
      --:--:--
    </div>

  </div>


  <main id="timerWrap">

    <div id="timer">
      00:00.0
    </div>

    <div id="status">
      TAP TO START
    </div>

  </main>


  <div id="bottom">


    <div id="hint">
      <strong>画面をタップ</strong>
      → 0:00.0
    </div>


    <div id="adjustPanel">


      <div id="adjustLabels">

        <span>
          補正
        </span>

        <span id="adjustValue">
          0.0秒
        </span>

      </div>


      <input
        id="slider"
        type="range"
        min="-20"
        max="20"
        step="0.1"
        value="0"
        aria-label="時間補正"
      >


    </div>

  </div>


  <div id="flash"></div>


</div>


<script>

(() => {

"use strict";


/* =========================
   DOM
========================= */

const timer =
  document.getElementById("timer");

const status =
  document.getElementById("status");

const clock =
  document.getElementById("clock");

const slider =
  document.getElementById("slider");

const adjustPanel =
  document.getElementById("adjustPanel");

const adjustValue =
  document.getElementById("adjustValue");

const flash =
  document.getElementById("flash");


/* =========================
   状態
========================= */

let running = false;

/*
  スタートしたperformance.now()
*/
let startTime = 0;

/*
  補正値 ms

  +1000 = 1秒進める
  -1000 = 1秒戻す
*/
let correctionMs = 0;

let animationId = null;


/* =========================
   表示フォーマット
========================= */

function formatTime(ms){

  /*
    表示上は0より前にしない。

    重要：
    これは補正値を消しているのではなく、
    「表示だけ」0で止めている。

    例えば -5秒補正なら、
    スタート後5秒間は00:00.0、
    その後00:00.1から進む。
  */

  const displayMs =
    Math.max(0, ms);


  const totalTenths =
    Math.floor(displayMs / 100);


  const minutes =
    Math.floor(
      totalTenths / 600
    );


  const seconds =
    Math.floor(
      (totalTenths % 600) / 10
    );


  const tenths =
    totalTenths % 10;


  return (
    String(minutes).padStart(2,"0")
    +
    ":"
    +
    String(seconds).padStart(2,"0")
    +
    "."
    +
    tenths
  );

}


/* =========================
   現在のタイマー値
========================= */

function getElapsed(now){

  /*
    経過時間
    ＋
    補正値

    これだけ。

    補正をstartTimeには絶対に混ぜない。
  */

  return (
    (now - startTime)
    +
    correctionMs
  );

}


/* =========================
   描画
========================= */

function render(now){

  if(!running){
    return;
  }


  const elapsed =
    getElapsed(now);


  timer.textContent =
    formatTime(elapsed);


  animationId =
    requestAnimationFrame(render);

}


/* =========================
   0スタート
========================= */

function startTimer(){


  /*
    古い描画を止める
  */

  if(animationId !== null){

    cancelAnimationFrame(
      animationId
    );

    animationId = null;

  }


  /*
    ここが重要。

    タップした瞬間を
    純粋なスタート時間として保存。

    correctionMsは混ぜない。
  */

  startTime =
    performance.now();


  running = true;


  /*
    ユーザーの要求通り
    タップした瞬間は必ず00:00.0表示。

    次の描画から補正が反映される。
  */

  timer.textContent =
    "00:00.0";


  status.textContent =
    "RUNNING";

  status.classList.add(
    "running"
  );


  tapFeedback();


  animationId =
    requestAnimationFrame(render);

}


/* =========================
   タップ成功表示
========================= */

function tapFeedback(){

  flash.classList.remove("on");

  void flash.offsetWidth;

  flash.classList.add("on");


  /*
    iOS Safariではvibrateが
    利用できない場合がある。
    利用可能な環境だけ実行。
  */

  if("vibrate" in navigator){

    try{

      navigator.vibrate(15);

    }
    catch(error){}

  }

}


/* =========================
   画面全体スタート
========================= */

document.addEventListener(
  "pointerdown",
  (event) => {


    /*
      補正パネルを操作した場合だけ
      スタートしない
    */

    if(
      event.target.closest(
        "#adjustPanel"
      )
    ){
      return;
    }


    /*
      それ以外は全部スタート。

      数字
      上部
      空白
      下部の空白

      どこでもOK。
    */

    startTimer();

  },
  {
    passive:true
  }
);


/* =========================
   補正
========================= */

function updateCorrection(){


  const seconds =
    Number(slider.value);


  /*
    補正値をそのままmsへ変換。

    -3.0 → -3000
    +3.0 → +3000
  */

  correctionMs =
    seconds * 1000;


  /*
    表示
  */

  let text;


  if(seconds > 0){

    text =
      "+"
      +
      seconds.toFixed(1)
      +
      "秒";

  }
  else{

    text =
      seconds.toFixed(1)
      +
      "秒";

  }


  adjustValue.textContent =
    text;


  /*
    タイマーが動作中なら
    補正変更を即座に画面へ反映。

    スタート時間は変更しない。
    再スタートもしない。
  */

  if(running){

    const now =
      performance.now();


    timer.textContent =
      formatTime(
        getElapsed(now)
      );

  }

}


slider.addEventListener(
  "input",
  updateCorrection
);


/* =========================
   補正操作の誤スタート防止
========================= */

adjustPanel.addEventListener(
  "pointerdown",
  (event) => {

    event.stopPropagation();

  }
);


adjustPanel.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();

  }
);


/* =========================
   現在時刻
========================= */

function updateClock(){

  const now =
    new Date();


  const hours =
    String(
      now.getHours()
    ).padStart(2,"0");


  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  const seconds =
    String(
      now.getSeconds()
    ).padStart(2,"0");


  clock.textContent =
    hours
    +
    ":"
    +
    minutes
    +
    ":"
    +
    seconds;

}


updateClock();


setInterval(
  updateClock,
  250
);


/* =========================
   初期化
========================= */

updateCorrection();

timer.textContent =
  "00:00.0";


})();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>QuickQ TEST</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

#app{
  position:absolute;
  inset:0;
  background:#000;
}


/* 時計 */

#clock{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:22px;

  color:#777;
  font-size:17px;
  font-weight:600;
}


/* STARTエリア */

#startArea{
  position:absolute;

  top:90px;
  left:8px;
  right:8px;

  bottom:245px;

  border:2px solid #444;
  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  touch-action:manipulation;
}


/* START文字 */

#startText{
  position:absolute;

  bottom:14px;
  left:50%;

  transform:translateX(-50%);

  color:#444;

  font-size:12px;
  font-weight:700;

  letter-spacing:4px;

  pointer-events:none;
}


/* タイマー */

#timer{
  font-size:23vw;
  font-weight:700;

  line-height:1;

  letter-spacing:-0.07em;

  white-space:nowrap;

  font-variant-numeric:tabular-nums;

  pointer-events:none;
}


/* STOP */

#stopButton{
  position:absolute;

  top:120px;
  left:50%;

  transform:translateX(-50%);

  width:145px;
  height:58px;

  border:2px solid #ff5252;

  border-radius:16px;

  background:#481515;

  color:#ff5757;

  font-size:20px;
  font-weight:800;

  z-index:20;

  touch-action:manipulation;
}


/* 補正 */

#adjustPanel{
  position:absolute;

  left:6%;
  right:6%;

  bottom:max(
    65px,
    calc(env(safe-area-inset-bottom) + 45px)
  );

  height:125px;
}


#correctionValue{
  text-align:center;

  color:#aaa;

  font-size:24px;
  font-weight:600;

  margin-bottom:14px;
}


/* スライダー */

.sliderWrap{
  position:relative;

  width:100%;
  height:55px;
}


#correction{
  position:absolute;

  left:0;
  top:23px;

  width:100%;

  margin:0;

  appearance:none;
  -webkit-appearance:none;

  height:6px;

  background:#666;

  border-radius:10px;

  z-index:5;
}


#correction::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:42px;
  height:42px;

  border-radius:50%;

  background:#fff;

  border:2px solid #aaa;
}


/* 目盛り */

.tick{
  position:absolute;

  top:8px;

  width:2px;
  height:35px;

  background:#777;

  transform:translateX(-50%);

  pointer-events:none;
}


.m20{left:16.6667%;}
.m10{left:33.3333%;}

.zero{
  left:50%;
  width:3px;
  background:#fff;
}

.p10{left:66.6667%;}
.p20{left:83.3333%;}


/* 数字 */

.labels{
  position:relative;

  height:25px;

  color:#666;

  font-size:13px;
  font-weight:600;
}


.labels span{
  position:absolute;
  white-space:nowrap;
}


.l30{
  left:0;
}

.l20{
  left:16.6667%;
  transform:translateX(-50%);
}

.l10{
  left:33.3333%;
  transform:translateX(-50%);
}

.l0{
  left:50%;
  transform:translateX(-50%);

  color:#aaa;
}

.r10{
  left:66.6667%;
  transform:translateX(-50%);
}

.r20{
  left:83.3333%;
  transform:translateX(-50%);
}

.r30{
  right:0;
}


/* 動作確認表示 */

#status{
  position:absolute;

  top:20px;
  left:50%;

  transform:translateX(-50%);

  color:#39ff88;

  font-size:12px;

  opacity:.7;
}

</style>
</head>


<body>

<div id="app">

  <div id="clock"></div>

  <div id="status">
    TEST
  </div>


  <div id="startArea">

    <button
      id="stopButton"
      type="button">
      ■ STOP
    </button>


    <div id="timer">
      00:00.0
    </div>


    <div id="startText">
      START
    </div>

  </div>


  <div id="adjustPanel">

    <div id="correctionValue">
      0.0秒
    </div>


    <div class="sliderWrap">

      <div class="tick m20"></div>

      <div class="tick m10"></div>

      <div class="tick zero"></div>

      <div class="tick p10"></div>

      <div class="tick p20"></div>


      <input
        id="correction"
        type="range"
        min="-30"
        max="30"
        step="0.5"
        value="0"
      >

    </div>


    <div class="labels">

      <span class="l30">−30</span>

      <span class="l20">−20</span>

      <span class="l10">−10</span>

      <span class="l0">0</span>

      <span class="r10">+10</span>

      <span class="r20">+20</span>

      <span class="r30">+30</span>

    </div>

  </div>

</div>


<script>

(function(){

/* =========================
   要素
========================= */

var timer =
  document.getElementById("timer");

var startArea =
  document.getElementById("startArea");

var stopButton =
  document.getElementById("stopButton");

var correction =
  document.getElementById("correction");

var correctionValue =
  document.getElementById("correctionValue");

var clock =
  document.getElementById("clock");

var status =
  document.getElementById("status");


/* =========================
   状態
========================= */

var running = false;

var startTime = 0;

var stoppedTime = 0;

var raf = null;


/* =========================
   時計
========================= */

function updateClock(){

  var now = new Date();

  var hours =
    String(now.getHours())
    .padStart(2,"0");

  var minutes =
    String(now.getMinutes())
    .padStart(2,"0");

  clock.textContent =
    hours + ":" + minutes;

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================
   表示変換
========================= */

function formatTime(ms){

  if(ms < 0){
    ms = 0;
  }

  var tenths =
    Math.floor(ms / 100);

  var minutes =
    Math.floor(tenths / 600);

  var seconds =
    Math.floor(
      (tenths % 600) / 10
    );

  var decimal =
    tenths % 10;


  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(seconds)
      .padStart(2,"0")
    +
    "."
    +
    decimal
  );

}


/* =========================
   補正値
========================= */

function correctionMs(){

  return (
    parseFloat(
      correction.value
    )
    *
    1000
  );

}


/* =========================
   現在時間
========================= */

function currentElapsed(){

  if(running){

    return (
      Date.now()
      -
      startTime
      +
      correctionMs()
    );

  }

  return stoppedTime;

}


/* =========================
   描画
========================= */

function draw(){

  if(!running){
    return;
  }

  timer.textContent =
    formatTime(
      currentElapsed()
    );


  raf =
    requestAnimationFrame(
      draw
    );

}


/* =========================
   START
========================= */

function startTimer(){

  startTime =
    Date.now();

  stoppedTime =
    correctionMs();

  running =
    true;


  timer.textContent =
    formatTime(
      stoppedTime
    );


  status.textContent =
    "RUN";


  if(raf !== null){

    cancelAnimationFrame(
      raf
    );

  }


  raf =
    requestAnimationFrame(
      draw
    );

}


/* =========================
   STOP
========================= */

function stopTimer(){

  if(!running){

    status.textContent =
      "STOP";

    return;
  }


  stoppedTime =
    currentElapsed();


  running =
    false;


  if(raf !== null){

    cancelAnimationFrame(
      raf
    );

    raf = null;

  }


  timer.textContent =
    formatTime(
      stoppedTime
    );


  status.textContent =
    "STOP";

}


/* =========================
   STARTタッチ
========================= */

startArea.ontouchstart =
  function(event){

    /*
      STOPボタンを触った場合は
      STARTしない
    */

    if(
      event.target === stopButton
    ){
      return;
    }


    event.preventDefault();

    startTimer();

  };


/*
  通常クリックも対応
*/

startArea.onclick =
  function(event){

    if(
      event.target === stopButton
    ){
      return;
    }


    startTimer();

  };


/* =========================
   STOPタッチ
========================= */

stopButton.ontouchstart =
  function(event){

    event.preventDefault();

    event.stopPropagation();

    stopTimer();

  };


stopButton.onclick =
  function(event){

    event.preventDefault();

    event.stopPropagation();

    stopTimer();

  };


/* =========================
   スライダー
========================= */

function sliderChanged(){

  var value =
    parseFloat(
      correction.value
    );


  if(value > 0){

    correctionValue.textContent =
      "+"
      +
      value.toFixed(1)
      +
      "秒";

  }
  else{

    correctionValue.textContent =
      value.toFixed(1)
      +
      "秒";

  }


  /*
    停止中なら
    スライダー値をそのまま表示
  */

  if(!running){

    stoppedTime =
      value * 1000;

    timer.textContent =
      formatTime(
        stoppedTime
      );

  }


  /*
    動作中も即反映
  */

  if(running){

    timer.textContent =
      formatTime(
        currentElapsed()
      );

  }


  status.textContent =
    "SLIDER "
    +
    value.toFixed(1);

}


correction.oninput =
  sliderChanged;

correction.onchange =
  sliderChanged;


/* =========================
   初期化完了
========================= */

status.textContent =
  "READY";

timer.textContent =
  "00:00.0";

correctionValue.textContent =
  "0.0秒";

})();
</script>

</body>
</html>

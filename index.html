<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>QuickQ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

body{
  position:relative;
}

#app{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* =========================
   時計
========================= */

#clock{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:22px;

  font-size:17px;
  font-weight:600;
  color:#777;
  letter-spacing:.5px;

  z-index:20;
}

/* =========================
   設定ボタン
========================= */

#settingsButton{
  position:absolute;

  top:max(12px,env(safe-area-inset-top));
  right:14px;

  width:52px;
  height:52px;

  border:0;
  border-radius:50%;

  background:#151515;
  color:#aaa;

  font-size:27px;
  line-height:52px;
  text-align:center;

  z-index:20;
}

/* =========================
   STARTエリア

   この枠の中だけ
   スタート / 再スタート
========================= */

#startArea{
  position:absolute;

  /*
    時計・設定ボタンの
    すぐ下から開始
  */
  top:max(
    78px,
    calc(env(safe-area-inset-top) + 62px)
  );

  /*
    左右はほぼ画面いっぱい
  */
  left:8px;
  right:8px;

  /*
    補正スライダーより
    十分上で終了
  */
  bottom:max(
    245px,
    calc(env(safe-area-inset-bottom) + 220px)
  );

  border:2px solid #444;
  border-radius:18px;

  z-index:5;

  touch-action:manipulation;
}

/* START表示 */

#startArea::after{
  content:"START";

  position:absolute;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  color:#3f3f3f;

  font-size:12px;
  font-weight:700;
  letter-spacing:3px;

  pointer-events:none;
}

/* =========================
   タイマー
========================= */

#timerArea{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#timer{
  font-family:Arial,sans-serif;

  font-size:clamp(
    82px,
    23vw,
    190px
  );

  font-weight:700;

  line-height:1;

  letter-spacing:-0.07em;

  color:#ffffff;

  white-space:nowrap;

  font-variant-numeric:
    tabular-nums;

  font-feature-settings:
    "tnum";

  text-align:center;

  pointer-events:none;
}

/* =========================
   タッチ時フラッシュ
========================= */

#flash{
  position:absolute;
  inset:0;

  background:
    rgba(255,255,255,.08);

  opacity:0;

  pointer-events:none;

  z-index:50;
}

#flash.active{
  animation:
    flash .10s ease-out;
}

@keyframes flash{

  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

/* =========================
   補正
========================= */

#adjustPanel{
  position:absolute;

  left:6%;
  right:6%;

  bottom:max(
    70px,
    calc(
      env(safe-area-inset-bottom)
      + 48px
    )
  );

  z-index:10;
}

#correctionValue{
  text-align:center;

  color:#aaa;

  font-size:24px;
  font-weight:600;

  margin-bottom:12px;
}

.sliderWrap{
  position:relative;

  width:100%;
  height:50px;

  display:flex;
  align-items:center;
}

.centerMark{
  position:absolute;

  left:50%;
  top:3px;
  bottom:3px;

  width:3px;

  transform:
    translateX(-50%);

  background:#fff;

  border-radius:2px;

  opacity:.75;

  pointer-events:none;
}

#correction{
  position:relative;

  z-index:2;

  width:100%;
  height:6px;

  appearance:none;
  -webkit-appearance:none;

  background:#666;

  border-radius:10px;

  outline:none;
}

#correction::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:42px;
  height:42px;

  border-radius:50%;

  background:#fff;

  border:2px solid #aaa;
}

.sliderLabels{
  position:relative;

  height:28px;

  margin-top:1px;

  color:#555;

  font-size:16px;
}

.sliderLabels span{
  position:absolute;
}

.sliderLabels .left{
  left:0;
}

.sliderLabels .center{
  left:50%;

  transform:
    translateX(-50%);

  color:#999;

  font-weight:700;
}

.sliderLabels .right{
  right:0;
}

/* =========================
   設定画面
========================= */

#settings{
  position:absolute;
  inset:0;

  background:
    rgba(0,0,0,.97);

  z-index:100;

  display:none;

  overflow:auto;

  padding:
    max(
      28px,
      env(safe-area-inset-top)
    )
    22px
    max(
      30px,
      env(safe-area-inset-bottom)
    );
}

#settings.open{
  display:block;
}

.settingsHeader{
  display:flex;

  align-items:center;

  justify-content:
    space-between;

  margin-bottom:28px;
}

.settingsTitle{
  font-size:26px;
  font-weight:700;
}

#closeSettings{
  width:50px;
  height:50px;

  border:0;

  border-radius:50%;

  background:#222;
  color:#fff;

  font-size:28px;
}

.settingGroup{
  margin-bottom:28px;
}

.settingLabel{
  color:#999;

  font-size:15px;

  margin-bottom:10px;
}

.settingValue{
  color:#fff;

  font-size:20px;

  font-weight:600;

  margin-bottom:8px;
}

.settingRange{
  width:100%;
  height:6px;

  appearance:none;
  -webkit-appearance:none;

  background:#555;

  border-radius:8px;
}

.settingRange::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:34px;
  height:34px;

  border-radius:50%;

  background:#fff;
}

/* =========================
   フォント
========================= */

.fontGrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.fontButton{
  min-height:56px;

  border:
    1px solid #333;

  border-radius:14px;

  background:#111;

  color:#bbb;

  font-size:18px;
}

.fontButton.selected{
  border:
    2px solid #fff;

  color:#fff;

  background:#222;
}

/* =========================
   色
========================= */

.colorGrid{
  display:flex;

  flex-wrap:wrap;

  gap:14px;
}

.colorButton{
  width:52px;
  height:52px;

  border-radius:50%;

  border:
    3px solid transparent;
}

.colorButton.selected{
  border-color:#fff;

  transform:
    scale(1.12);
}

.white{background:#ffffff;}
.green{background:#39ff88;}
.red{background:#ff4b4b;}
.yellow{background:#ffe04b;}
.blue{background:#55aaff;}
.orange{background:#ff963f;}
.cyan{background:#45f4ff;}

/* =========================
   プレビュー
========================= */

#preview{
  margin-top:30px;

  padding:24px 5px;

  border-top:
    1px solid #222;

  border-bottom:
    1px solid #222;

  text-align:center;

  font-size:58px;

  font-weight:700;

  white-space:nowrap;

  font-variant-numeric:
    tabular-nums;
}

#resetSettings{
  width:100%;
  height:54px;

  margin-top:30px;

  border:
    1px solid #333;

  border-radius:14px;

  background:#111;

  color:#aaa;

  font-size:17px;
}

</style>
</head>


<body>

<div id="app">

  <div id="clock"></div>

  <button
    id="settingsButton"
    aria-label="設定">
    ⚙︎
  </button>


  <!--
    この枠の中だけ
    START可能
  -->

  <div id="startArea">

    <div id="timerArea">

      <div id="timer">
        00:00.0
      </div>

    </div>

  </div>


  <div id="adjustPanel">

    <div id="correctionValue">
      0.0秒
    </div>

    <div class="sliderWrap">

      <div class="centerMark"></div>

      <input
        id="correction"
        type="range"
        min="-20"
        max="20"
        step="0.1"
        value="0"
      >

    </div>

    <div class="sliderLabels">

      <span class="left">
        −20秒
      </span>

      <span class="center">
        0
      </span>

      <span class="right">
        ＋20秒
      </span>

    </div>

  </div>

  <div id="flash"></div>

</div>


<!-- =========================
     設定
========================= -->

<div id="settings">

  <div class="settingsHeader">

    <div class="settingsTitle">
      表示設定
    </div>

    <button id="closeSettings">
      ×
    </button>

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の大きさ
    </div>

    <div
      class="settingValue"
      id="sizeValue">
      100%
    </div>

    <input
      id="sizeSetting"
      class="settingRange"
      type="range"
      min="70"
      max="135"
      step="1"
      value="100"
    >

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の太さ
    </div>

    <div
      class="settingValue"
      id="weightValue">
      太字
    </div>

    <input
      id="weightSetting"
      class="settingRange"
      type="range"
      min="300"
      max="900"
      step="100"
      value="700"
    >

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      フォント
    </div>

    <div class="fontGrid">

      <button
        class="fontButton selected"
        data-font="Arial, sans-serif">
        ABC 123
      </button>

      <button
        class="fontButton"
        data-font="'Arial Black', Arial, sans-serif"
        style="
          font-family:
          'Arial Black',
          Arial,
          sans-serif
        ">
        ABC 123
      </button>

      <button
        class="fontButton"
        data-font="'Courier New', monospace"
        style="
          font-family:
          'Courier New',
          monospace
        ">
        00:12.3
      </button>

      <button
        class="fontButton"
        data-font="-apple-system, BlinkMacSystemFont, sans-serif">
        iPhone
      </button>

    </div>

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の色
    </div>

    <div class="colorGrid">

      <button
        class="colorButton white selected"
        data-color="#ffffff"
        aria-label="白">
      </button>

      <button
        class="colorButton green"
        data-color="#39ff88"
        aria-label="緑">
      </button>

      <button
        class="colorButton red"
        data-color="#ff4b4b"
        aria-label="赤">
      </button>

      <button
        class="colorButton yellow"
        data-color="#ffe04b"
        aria-label="黄色">
      </button>

      <button
        class="colorButton blue"
        data-color="#55aaff"
        aria-label="青">
      </button>

      <button
        class="colorButton orange"
        data-color="#ff963f"
        aria-label="オレンジ">
      </button>

      <button
        class="colorButton cyan"
        data-color="#45f4ff"
        aria-label="水色">
      </button>

    </div>

  </div>


  <div id="preview">
    00:12.3
  </div>

  <button id="resetSettings">
    表示設定を初期状態に戻す
  </button>

</div>


<script>
(() => {

/* =========================
   要素取得
========================= */

const timer =
  document.getElementById("timer");

const clock =
  document.getElementById("clock");

const startArea =
  document.getElementById("startArea");

const correction =
  document.getElementById("correction");

const correctionValue =
  document.getElementById(
    "correctionValue"
  );

const adjustPanel =
  document.getElementById(
    "adjustPanel"
  );

const flash =
  document.getElementById("flash");

const settings =
  document.getElementById("settings");

const settingsButton =
  document.getElementById(
    "settingsButton"
  );

const closeSettings =
  document.getElementById(
    "closeSettings"
  );

const sizeSetting =
  document.getElementById(
    "sizeSetting"
  );

const sizeValue =
  document.getElementById(
    "sizeValue"
  );

const weightSetting =
  document.getElementById(
    "weightSetting"
  );

const weightValue =
  document.getElementById(
    "weightValue"
  );

const preview =
  document.getElementById("preview");


/* =========================
   タイマー状態
========================= */

let running = false;

let startRealTime = 0;

let animationId = null;


/* =========================
   タイマー状態保存

   iOSがバックグラウンドで
   QuickQを再読み込みしても
   開始時刻を復元
========================= */

const TIMER_STATE_KEY =
  "quickq_timer_state";


function saveTimerState(){

  try{

    const state = {

      running:
        running,

      startRealTime:
        startRealTime,

      correction:
        Number(
          correction.value
        )

    };

    localStorage.setItem(
      TIMER_STATE_KEY,
      JSON.stringify(state)
    );

  }
  catch(e){}

}


function restoreTimerState(){

  try{

    const raw =
      localStorage.getItem(
        TIMER_STATE_KEY
      );

    if(!raw){
      return false;
    }

    const state =
      JSON.parse(raw);

    if(
      !state ||
      state.running !== true ||
      !Number.isFinite(
        Number(
          state.startRealTime
        )
      )
    ){
      return false;
    }

    running = true;

    startRealTime =
      Number(
        state.startRealTime
      );

    if(
      Number.isFinite(
        Number(
          state.correction
        )
      )
    ){

      correction.value =
        Number(
          state.correction
        );

    }

    return true;

  }
  catch(e){

    return false;

  }

}


/* =========================
   時計
========================= */

function updateClock(){

  const now =
    new Date();

  clock.textContent =
    now.toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    );

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================
   タイマー表示
========================= */

function formatTime(milliseconds){

  milliseconds =
    Math.max(
      0,
      milliseconds
    );

  const totalTenths =
    Math.floor(
      milliseconds / 100
    );

  const minutes =
    Math.floor(
      totalTenths / 600
    );

  const seconds =
    Math.floor(
      (totalTenths % 600)
      / 10
    );

  const tenths =
    totalTenths % 10;

  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(seconds)
      .padStart(2,"0")
    +
    "."
    +
    tenths
  );

}


/* =========================
   現在の経過時間
========================= */

function getElapsed(){

  if(!running){
    return 0;
  }

  const correctionMs =
    Number(
      correction.value
    ) * 1000;

  return (
    Date.now()
    -
    startRealTime
    +
    correctionMs
  );

}


/* =========================
   描画
========================= */

function draw(){

  if(!running){
    return;
  }

  timer.textContent =
    formatTime(
      getElapsed()
    );

  animationId =
    requestAnimationFrame(
      draw
    );

}


/* =========================
   START / 再START
========================= */

function startImmediately(){

  startRealTime =
    Date.now();

  running = true;

  const correctionMs =
    Number(
      correction.value
    ) * 1000;

  timer.textContent =
    formatTime(
      correctionMs
    );

  /*
    開始時刻を即保存
  */

  saveTimerState();


  if(animationId){

    cancelAnimationFrame(
      animationId
    );

  }

  animationId =
    requestAnimationFrame(
      draw
    );


  /* フラッシュ */

  flash.classList.remove(
    "active"
  );

  void flash.offsetWidth;

  flash.classList.add(
    "active"
  );

}


/* =========================
   START枠

   pointerdownなので
   指が触れた瞬間スタート

   枠外にはSTARTイベントを
   一切設定しない
========================= */

startArea.addEventListener(
  "pointerdown",
  (event) => {

    if(
      settings.classList.contains(
        "open"
      )
    ){
      return;
    }

    startImmediately();

  },
  {
    passive:true
  }
);


/* =========================
   古いiPhone用
========================= */

startArea.addEventListener(
  "touchstart",
  (event) => {

    if(window.PointerEvent){
      return;
    }

    if(
      settings.classList.contains(
        "open"
      )
    ){
      return;
    }

    startImmediately();

  },
  {
    passive:true
  }
);


/* =========================
   補正
========================= */

function updateCorrection(){

  const value =
    Number(
      correction.value
    );

  if(value > 0){

    correctionValue.textContent =
      "+"
      +
      value.toFixed(1)
      +
      "秒";

  }
  else{

    correctionValue.textContent =
      value.toFixed(1)
      +
      "秒";

  }

  if(running){

    timer.textContent =
      formatTime(
        getElapsed()
      );

    saveTimerState();

  }

}


correction.addEventListener(
  "input",
  updateCorrection
);


/* =========================
   設定画面
========================= */

settingsButton.addEventListener(
  "pointerdown",
  (event) => {

    event.stopPropagation();

  }
);


settingsButton.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();

    settings.classList.add(
      "open"
    );

  }
);


closeSettings.addEventListener(
  "click",
  () => {

    settings.classList.remove(
      "open"
    );

  }
);


/* =========================
   表示設定保存
========================= */

function saveSetting(
  name,
  value
){

  try{

    localStorage.setItem(
      "quickq_" + name,
      value
    );

  }
  catch(e){}

}


function loadSetting(
  name,
  fallback
){

  try{

    return (
      localStorage.getItem(
        "quickq_" + name
      )
      ||
      fallback
    );

  }
  catch(e){

    return fallback;

  }

}


/* =========================
   サイズ
========================= */

function applySize(value){

  value =
    Math.max(
      70,
      Math.min(
        135,
        Number(value)
      )
    );

  sizeSetting.value =
    value;

  sizeValue.textContent =
    value + "%";

  const vw =
    23 *
    (value / 100);

  timer.style.fontSize =
    "clamp(70px,"
    +
    vw
    +
    "vw,230px)";

  preview.style.fontSize =
    (
      58 *
      value /
      100
    )
    +
    "px";

  saveSetting(
    "size",
    value
  );

}


sizeSetting.addEventListener(
  "input",
  () => {

    applySize(
      sizeSetting.value
    );

  }
);


/* =========================
   太さ
========================= */

function weightName(value){

  value =
    Number(value);

  if(value <= 300){
    return "細い";
  }

  if(value <= 500){
    return "標準";
  }

  if(value <= 700){
    return "太字";
  }

  return "極太";

}


function applyWeight(value){

  value =
    Math.max(
      300,
      Math.min(
        900,
        Number(value)
      )
    );

  timer.style.fontWeight =
    value;

  preview.style.fontWeight =
    value;

  weightSetting.value =
    value;

  weightValue.textContent =
    weightName(value);

  saveSetting(
    "weight",
    value
  );

}


weightSetting.addEventListener(
  "input",
  () => {

    applyWeight(
      weightSetting.value
    );

  }
);


/* =========================
   フォント
========================= */

const fontButtons =
  document.querySelectorAll(
    ".fontButton"
  );


function applyFont(font){

  timer.style.fontFamily =
    font;

  preview.style.fontFamily =
    font;

  fontButtons.forEach(
    button => {

      button.classList.toggle(
        "selected",
        button.dataset.font
        ===
        font
      );

    }
  );

  saveSetting(
    "font",
    font
  );

}


fontButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        applyFont(
          button.dataset.font
        );

      }
    );

  }
);


/* =========================
   色
========================= */

const colorButtons =
  document.querySelectorAll(
    ".colorButton"
  );


function applyColor(color){

  timer.style.color =
    color;

  preview.style.color =
    color;

  colorButtons.forEach(
    button => {

      button.classList.toggle(
        "selected",
        button.dataset.color
        ===
        color
      );

    }
  );

  saveSetting(
    "color",
    color
  );

}


colorButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        applyColor(
          button.dataset.color
        );

      }
    );

  }
);


/* =========================
   表示設定リセット
========================= */

document
.getElementById(
  "resetSettings"
)
.addEventListener(
  "click",
  () => {

    applySize(100);

    applyWeight(700);

    applyFont(
      "Arial, sans-serif"
    );

    applyColor(
      "#ffffff"
    );

  }
);


/* =========================
   表示設定復元
========================= */

applySize(
  loadSetting(
    "size",
    "100"
  )
);

applyWeight(
  loadSetting(
    "weight",
    "700"
  )
);

applyFont(
  loadSetting(
    "font",
    "Arial, sans-serif"
  )
);

applyColor(
  loadSetting(
    "color",
    "#ffffff"
  )
);


/* =========================
   タイマー状態復元
========================= */

const restored =
  restoreTimerState();

updateCorrection();


if(restored){

  timer.textContent =
    formatTime(
      getElapsed()
    );

  animationId =
    requestAnimationFrame(
      draw
    );

}
else{

  timer.textContent =
    "00:00.0";

}


/* =========================
   他アプリへ移動 / 復帰
========================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState
      ===
      "visible"
    ){

      /*
        戻った瞬間に
        Date.now()から再計算
      */

      if(running){

        timer.textContent =
          formatTime(
            getElapsed()
          );

        if(animationId){

          cancelAnimationFrame(
            animationId
          );

        }

        animationId =
          requestAnimationFrame(
            draw
          );

      }

    }
    else{

      /*
        他アプリへ移動する直前に
        状態を保存
      */

      if(running){

        saveTimerState();

      }

      /*
        描画だけ停止。
        時計自体は止めない。
      */

      if(animationId){

        cancelAnimationFrame(
          animationId
        );

        animationId = null;

      }

    }

  }
);


/* =========================
   画面スリープ防止
========================= */

let wakeLock = null;


async function keepScreenAwake(){

  if(
    !(
      "wakeLock"
      in
      navigator
    )
  ){
    return;
  }

  try{

    if(
      wakeLock === null
      &&
      document.visibilityState
      ===
      "visible"
    ){

      wakeLock =
        await navigator
        .wakeLock
        .request(
          "screen"
        );

      wakeLock.addEventListener(
        "release",
        () => {

          wakeLock = null;

        }
      );

    }

  }
  catch(error){

    wakeLock = null;

  }

}


/*
  START枠を最初に触った時に
  スリープ防止を有効化
*/

startArea.addEventListener(
  "pointerdown",
  keepScreenAwake,
  {
    passive:true,
    once:true
  }
);


/*
  他アプリから戻った時も
  Wake Lock再取得
*/

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState
      ===
      "visible"
    ){

      keepScreenAwake();

    }

  }
);


})();
</script>

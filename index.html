<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">

<title>QuickQTimer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,
               "SF Pro Display","Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

body{
  min-height:100dvh;
}

/* 全画面スタートエリア */
#startArea{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* 現在時刻 */
#clock{
  position:absolute;
  top:max(22px,env(safe-area-inset-top));
  right:28px;

  font-size:clamp(18px,4vw,28px);
  font-weight:400;
  letter-spacing:.06em;
  color:#777;
  font-variant-numeric:tabular-nums;
}

/* メインタイマー */
#timer{
  width:100%;
  text-align:center;

  font-size:clamp(86px,24vw,190px);
  line-height:.9;

  font-weight:300;
  letter-spacing:-.075em;

  color:#fff;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  transform:translateY(-5vh);
}

/* タップ案内 */
#hint{
  position:absolute;
  bottom:185px;
  width:100%;
  text-align:center;

  font-size:clamp(13px,3.3vw,20px);
  font-weight:500;
  letter-spacing:.25em;
  color:#444;

  transition:.2s;
}

/* 動作中 */
.running #hint{
  opacity:0;
}

/* 補正部分 */
#adjustPanel{
  position:fixed;
  left:0;
  right:0;
  bottom:max(30px,env(safe-area-inset-bottom));

  padding:0 34px;
  z-index:20;
}

#adjustRow{
  display:flex;
  align-items:center;
  gap:18px;
}

.adjustLabel{
  font-size:16px;
  color:#555;
  white-space:nowrap;
}

#adjustValue{
  width:65px;
  text-align:right;
  font-size:17px;
  color:#888;
  font-variant-numeric:tabular-nums;
}

#slider{
  flex:1;
  appearance:none;
  -webkit-appearance:none;
  height:38px;
  background:transparent;
}

#slider::-webkit-slider-runnable-track{
  height:4px;
  border-radius:10px;
  background:#555;
}

#slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:32px;
  height:32px;
  margin-top:-14px;

  border-radius:50%;
  border:none;
  background:#fff;
}

/* スタートした瞬間の軽い反応 */
.flash{
  animation:flash .18s ease-out;
}

@keyframes flash{
  0%{opacity:.35;}
  100%{opacity:1;}
}

</style>
</head>

<body>

<div id="startArea">

  <div id="clock">--:--:--</div>

  <div id="timer">0:00.0</div>

  <div id="hint">
    TAP ANYWHERE TO START
  </div>

</div>


<div id="adjustPanel">

  <div id="adjustRow">

    <span class="adjustLabel">補正</span>

    <input
      id="slider"
      type="range"
      min="-20"
      max="20"
      step="0.1"
      value="0"
    >

    <span id="adjustValue">0.0秒</span>

  </div>

</div>


<script>

const startArea = document.getElementById("startArea");
const timer = document.getElementById("timer");
const clock = document.getElementById("clock");

const slider = document.getElementById("slider");
const adjustValue = document.getElementById("adjustValue");

let running = false;
let startTime = 0;
let adjustment = 0;


/* ------------------------
   時間表示
------------------------- */

function formatTime(ms){

  if(ms < 0) ms = 0;

  const totalTenths = Math.floor(ms / 100);

  const minutes =
    Math.floor(totalTenths / 600);

  const seconds =
    Math.floor((totalTenths % 600) / 10);

  const tenth =
    totalTenths % 10;

  return (
    minutes +
    ":" +
    String(seconds).padStart(2,"0") +
    "." +
    tenth
  );
}


/* ------------------------
   タイマー更新
------------------------- */

function updateTimer(){

  if(!running) return;

  const elapsed =
    performance.now() -
    startTime +
    adjustment * 1000;

  timer.textContent =
    formatTime(elapsed);

  requestAnimationFrame(updateTimer);
}


/* ------------------------
   どこを押しても
   0:00.0からスタート
------------------------- */

function restart(){

  startTime = performance.now();

  running = true;

  document.body.classList.add("running");

  timer.textContent =
    formatTime(adjustment * 1000);

  timer.classList.remove("flash");

  void timer.offsetWidth;

  timer.classList.add("flash");

  requestAnimationFrame(updateTimer);
}


startArea.addEventListener(
  "pointerdown",
  restart
);


/* ------------------------
   補正スライダー
------------------------- */

slider.addEventListener("pointerdown",e=>{
  e.stopPropagation();
});

slider.addEventListener("click",e=>{
  e.stopPropagation();
});

slider.addEventListener("input",e=>{

  e.stopPropagation();

  adjustment =
    parseFloat(slider.value);

  adjustValue.textContent =
    (adjustment > 0 ? "+" : "") +
    adjustment.toFixed(1) +
    "秒";
});


/* ------------------------
   現在時刻
------------------------- */

function updateClock(){

  const d = new Date();

  clock.textContent =
    String(d.getHours()).padStart(2,"0") +
    ":" +
    String(d.getMinutes()).padStart(2,"0") +
    ":" +
    String(d.getSeconds()).padStart(2,"0");
}

updateClock();

setInterval(
  updateClock,
  250
);

</script>

</body>
</html>

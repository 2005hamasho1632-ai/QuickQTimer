<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>QuickQ</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue",Arial,sans-serif;
}

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  background:#000;
}


/* =========================
   巨大タイマー
========================= */

#timerArea{
  position:absolute;
  left:0;
  right:0;
  top:10%;
  height:58%;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#timer{
  width:100%;
  text-align:center;

  color:#fff;

  /*
    iPhoneで可能な限り大きく表示
  */
  font-size:clamp(82px,25vw,190px);
  font-weight:700;
  line-height:1;

  letter-spacing:-0.075em;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  white-space:nowrap;

  text-shadow:
    0 0 2px rgba(255,255,255,.3);
}


/* =========================
   補正エリア
========================= */

#adjustPanel{
  position:absolute;

  left:22px;
  right:22px;

  bottom:calc(env(safe-area-inset-bottom) + 24px);

  z-index:20;

  padding:12px 4px 4px;

  touch-action:none;
}

#adjustTop{
  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:5px;
}

#adjustValue{
  color:#aaa;

  font-size:24px;
  font-weight:600;

  font-variant-numeric:tabular-nums;
}


/* =========================
   スライダー
========================= */

#slider{
  display:block;

  width:100%;
  height:60px;

  margin:0;

  appearance:none;
  -webkit-appearance:none;

  background:transparent;

  touch-action:none;
}

#slider::-webkit-slider-runnable-track{
  height:5px;

  border-radius:999px;

  background:#555;
}

#slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:42px;
  height:42px;

  margin-top:-18.5px;

  border:0;
  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.2);
}

#slider::-moz-range-track{
  height:5px;
  background:#555;
}

#slider::-moz-range-thumb{
  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:#fff;
}


/* =========================
   -20 / +20
========================= */

#scale{
  display:flex;
  justify-content:space-between;

  margin-top:-5px;

  color:#555;

  font-size:13px;

  pointer-events:none;
}


/* =========================
   タップ表示
========================= */

#hint{
  margin-top:18px;

  text-align:center;

  color:#555;

  font-size:13px;
  font-weight:500;

  letter-spacing:.08em;

  pointer-events:none;
}


/* =========================
   タップした瞬間の反応
========================= */

#flash{
  position:absolute;
  inset:0;

  background:rgba(255,255,255,.10);

  opacity:0;

  pointer-events:none;

  z-index:100;
}

#flash.on{
  animation:tapFlash .12s ease-out;
}

@keyframes tapFlash{

  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* =========================
   横画面
========================= */

@media (orientation:landscape){

  #timerArea{
    top:0;
    height:72%;
  }

  #timer{
    font-size:clamp(80px,20vw,210px);
  }

  #adjustPanel{
    bottom:8px;
  }

  #hint{
    margin-top:5px;
  }

}

</style>
</head>


<body>

<div id="app">


  <div id="timerArea">

    <div id="timer">
      00:00.0
    </div>

  </div>


  <div id="adjustPanel">


    <div id="adjustTop">

      <div id="adjustValue">
        0.0秒
      </div>

    </div>


    <input
      id="slider"
      type="range"
      min="-20"
      max="20"
      step="0.1"
      value="0"
      aria-label="時間補正"
    >


    <div id="scale">

      <span>-20秒</span>

      <span>0</span>

      <span>+20秒</span>

    </div>


    <div id="hint">
      画面タップ → 0:00.0
    </div>


  </div>


  <div id="flash"></div>


</div>


<script>

(() => {

"use strict";


const timer =
  document.getElementById("timer");

const slider =
  document.getElementById("slider");

const adjustPanel =
  document.getElementById("adjustPanel");

const adjustValue =
  document.getElementById("adjustValue");

const flash =
  document.getElementById("flash");


let running = false;

let startTime = 0;

let correctionMs = 0;

let animationId = null;


/* =========================
   時間表示
   00:00.0
========================= */

function formatTime(ms){

  const displayMs =
    Math.max(0,ms);


  const totalTenths =
    Math.floor(displayMs / 100);


  const minutes =
    Math.floor(totalTenths / 600);


  const seconds =
    Math.floor(
      (totalTenths % 600) / 10
    );


  const tenths =
    totalTenths % 10;


  return (
    String(minutes).padStart(2,"0")
    +
    ":"
    +
    String(seconds).padStart(2,"0")
    +
    "."
    +
    tenths
  );

}


/* =========================
   経過時間
========================= */

function getElapsed(now){

  return (
    now
    -
    startTime
    +
    correctionMs
  );

}


/* =========================
   タイマー描画
========================= */

function render(now){

  if(!running){
    return;
  }


  timer.textContent =
    formatTime(
      getElapsed(now)
    );


  animationId =
    requestAnimationFrame(render);

}


/* =========================
   スタート / 再スタート
========================= */

function startTimer(){

  if(animationId !== null){

    cancelAnimationFrame(animationId);

    animationId = null;

  }


  startTime =
    performance.now();


  running = true;


  /*
    タップした瞬間は必ず0表示
  */

  timer.textContent =
    "00:00.0";


  flash.classList.remove("on");

  void flash.offsetWidth;

  flash.classList.add("on");


  animationId =
    requestAnimationFrame(render);

}


/* =========================
   画面どこでもスタート
   補正エリアだけ除外
========================= */

document.addEventListener(
  "pointerdown",
  (event) => {

    if(
      event.target.closest("#adjustPanel")
    ){
      return;
    }


    startTimer();

  },
  {
    passive:true
  }
);


/* =========================
   補正
========================= */

function updateCorrection(){

  const seconds =
    Number(slider.value);


  correctionMs =
    seconds * 1000;


  if(seconds > 0){

    adjustValue.textContent =
      "+"
      +
      seconds.toFixed(1)
      +
      "秒";

  }
  else{

    adjustValue.textContent =
      seconds.toFixed(1)
      +
      "秒";

  }


  /*
    動作中なら即時反映
  */

  if(running){

    timer.textContent =
      formatTime(
        getElapsed(
          performance.now()
        )
      );

  }

}


slider.addEventListener(
  "input",
  updateCorrection
);


/* =========================
   スライダー操作で
   タイマーを再スタートさせない
========================= */

adjustPanel.addEventListener(
  "pointerdown",
  (event) => {

    event.stopPropagation();

  }
);


adjustPanel.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();

  }
);


/* =========================
   初期化
========================= */

updateCorrection();

timer.textContent =
  "00:00.0";


})();

</script>

</body>
</html>

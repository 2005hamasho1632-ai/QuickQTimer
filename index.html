<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>QuickQ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

body{
  position:relative;
}

#app{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(18px,env(safe-area-inset-bottom));
}

#clock{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:22px;
  font-size:17px;
  font-weight:600;
  color:#777;
  letter-spacing:.5px;
}

#settingsButton{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  right:14px;
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:#151515;
  color:#aaa;
  font-size:27px;
  line-height:52px;
  text-align:center;
  z-index:20;
}

#timerArea{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:-80px;
}

#timer{
  font-family:Arial,sans-serif;
  font-size:clamp(82px,23vw,190px);
  font-weight:700;
  line-height:1;
  letter-spacing:-0.07em;
  color:#ffffff;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  text-align:center;
}

#flash{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.08);
  opacity:0;
  pointer-events:none;
}

#flash.active{
  animation:flash .10s ease-out;
}

@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

#adjustPanel{
  position:absolute;
  left:6%;
  right:6%;
  bottom:max(70px,calc(env(safe-area-inset-bottom) + 48px));
  z-index:10;
}

#correctionValue{
  text-align:center;
  color:#aaa;
  font-size:24px;
  font-weight:600;
  margin-bottom:12px;
}

.sliderWrap{
  position:relative;
  width:100%;
  height:50px;
  display:flex;
  align-items:center;
}

.centerMark{
  position:absolute;
  left:50%;
  top:3px;
  bottom:3px;
  width:3px;
  transform:translateX(-50%);
  background:#fff;
  border-radius:2px;
  opacity:.75;
  pointer-events:none;
}

#correction{
  position:relative;
  z-index:2;
  width:100%;
  height:6px;
  appearance:none;
  -webkit-appearance:none;
  background:#666;
  border-radius:10px;
  outline:none;
}

#correction::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:2px solid #aaa;
}

.sliderLabels{
  position:relative;
  height:28px;
  margin-top:1px;
  color:#555;
  font-size:16px;
}

.sliderLabels span{
  position:absolute;
}

.sliderLabels .left{
  left:0;
}

.sliderLabels .center{
  left:50%;
  transform:translateX(-50%);
  color:#999;
  font-weight:700;
}

.sliderLabels .right{
  right:0;
}

#settings{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.97);
  z-index:100;
  display:none;
  overflow:auto;
  padding:
    max(28px,env(safe-area-inset-top))
    22px
    max(30px,env(safe-area-inset-bottom));
}

#settings.open{
  display:block;
}

.settingsHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.settingsTitle{
  font-size:26px;
  font-weight:700;
}

#closeSettings{
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:28px;
}

.settingGroup{
  margin-bottom:28px;
}

.settingLabel{
  color:#999;
  font-size:15px;
  margin-bottom:10px;
}

.settingValue{
  color:#fff;
  font-size:20px;
  font-weight:600;
  margin-bottom:8px;
}

.settingRange{
  width:100%;
  height:6px;
  appearance:none;
  -webkit-appearance:none;
  background:#555;
  border-radius:8px;
}

.settingRange::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#fff;
}

.fontGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.fontButton{
  min-height:56px;
  border:1px solid #333;
  border-radius:14px;
  background:#111;
  color:#bbb;
  font-size:18px;
}

.fontButton.selected{
  border:2px solid #fff;
  color:#fff;
  background:#222;
}

.colorGrid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.colorButton{
  width:52px;
  height:52px;
  border-radius:50%;
  border:3px solid transparent;
}

.colorButton.selected{
  border-color:#fff;
  transform:scale(1.12);
}

.white{background:#ffffff;}
.green{background:#39ff88;}
.red{background:#ff4b4b;}
.yellow{background:#ffe04b;}
.blue{background:#55aaff;}
.orange{background:#ff963f;}
.cyan{background:#45f4ff;}

#preview{
  margin-top:30px;
  padding:24px 5px;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  text-align:center;
  font-size:58px;
  font-weight:700;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

#resetSettings{
  width:100%;
  height:54px;
  margin-top:30px;
  border:1px solid #333;
  border-radius:14px;
  background:#111;
  color:#aaa;
  font-size:17px;
}

</style>
</head>

<body>

<div id="app">

  <div id="clock"></div>

  <button id="settingsButton" aria-label="設定">⚙︎</button>

  <div id="timerArea">
    <div id="timer">00:00.0</div>
  </div>

  <div id="adjustPanel">

    <div id="correctionValue">0.0秒</div>

    <div class="sliderWrap">

      <div class="centerMark"></div>

      <input
        id="correction"
        type="range"
        min="-20"
        max="20"
        step="0.1"
        value="0"
      >

    </div>

    <div class="sliderLabels">
      <span class="left">−20秒</span>
      <span class="center">0</span>
      <span class="right">＋20秒</span>
    </div>

  </div>

  <div id="flash"></div>

</div>


<div id="settings">

  <div class="settingsHeader">

    <div class="settingsTitle">
      表示設定
    </div>

    <button id="closeSettings">×</button>

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の大きさ
    </div>

    <div class="settingValue" id="sizeValue">
      100%
    </div>

    <input
      id="sizeSetting"
      class="settingRange"
      type="range"
      min="70"
      max="135"
      step="1"
      value="100"
    >

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の太さ
    </div>

    <div class="settingValue" id="weightValue">
      太字
    </div>

    <input
      id="weightSetting"
      class="settingRange"
      type="range"
      min="300"
      max="900"
      step="100"
      value="700"
    >

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      フォント
    </div>

    <div class="fontGrid">

      <button
        class="fontButton selected"
        data-font="Arial, sans-serif">
        ABC 123
      </button>

      <button
        class="fontButton"
        data-font="'Arial Black', Arial, sans-serif"
        style="font-family:'Arial Black',Arial,sans-serif">
        ABC 123
      </button>

      <button
        class="fontButton"
        data-font="'Courier New', monospace"
        style="font-family:'Courier New',monospace">
        00:12.3
      </button>

      <button
        class="fontButton"
        data-font="-apple-system, BlinkMacSystemFont, sans-serif">
        iPhone
      </button>

    </div>

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の色
    </div>

    <div class="colorGrid">

      <button class="colorButton white selected"
        data-color="#ffffff" aria-label="白"></button>

      <button class="colorButton green"
        data-color="#39ff88" aria-label="緑"></button>

      <button class="colorButton red"
        data-color="#ff4b4b" aria-label="赤"></button>

      <button class="colorButton yellow"
        data-color="#ffe04b" aria-label="黄色"></button>

      <button class="colorButton blue"
        data-color="#55aaff" aria-label="青"></button>

      <button class="colorButton orange"
        data-color="#ff963f" aria-label="オレンジ"></button>

      <button class="colorButton cyan"
        data-color="#45f4ff" aria-label="水色"></button>

    </div>

  </div>


  <div id="preview">
    00:12.3
  </div>

  <button id="resetSettings">
    表示設定を初期状態に戻す
  </button>

</div>


<script>
(() => {

const timer = document.getElementById("timer");
const clock = document.getElementById("clock");
const correction = document.getElementById("correction");
const correctionValue = document.getElementById("correctionValue");
const adjustPanel = document.getElementById("adjustPanel");
const flash = document.getElementById("flash");
const settings = document.getElementById("settings");
const settingsButton = document.getElementById("settingsButton");
const closeSettings = document.getElementById("closeSettings");
const sizeSetting = document.getElementById("sizeSetting");
const sizeValue = document.getElementById("sizeValue");
const weightSetting = document.getElementById("weightSetting");
const weightValue = document.getElementById("weightValue");
const preview = document.getElementById("preview");


/* =========================
   タイマー状態

   Date.now()を使うことで
   他アプリへ移動している間も
   経過時間を保持
========================= */

let running = false;
let startRealTime = 0;
let animationId = null;


/* =========================
   画面下部
   スタート禁止範囲
========================= */

const NO_START_BOTTOM = 80;


/* =========================
   時計
========================= */

function updateClock(){

  const now = new Date();

  clock.textContent =
    now.toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    );

}

updateClock();
setInterval(updateClock,1000);


/* =========================
   タイマー表示
========================= */

function formatTime(milliseconds){

  milliseconds =
    Math.max(0,milliseconds);

  const totalTenths =
    Math.floor(milliseconds / 100);

  const minutes =
    Math.floor(totalTenths / 600);

  const seconds =
    Math.floor(
      (totalTenths % 600) / 10
    );

  const tenths =
    totalTenths % 10;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0") +
    "." +
    tenths
  );

}


/* =========================
   現在の正しい経過時間
========================= */

function getElapsed(){

  if(!running){
    return 0;
  }

  const correctionMs =
    Number(correction.value) * 1000;

  return (
    Date.now() -
    startRealTime +
    correctionMs
  );

}


/* =========================
   描画
========================= */

function draw(){

  if(!running){
    return;
  }

  timer.textContent =
    formatTime(getElapsed());

  animationId =
    requestAnimationFrame(draw);

}


/* =========================
   即時スタート / 再スタート
========================= */

function startImmediately(){

  startRealTime =
    Date.now();

  running = true;

  const correctionMs =
    Number(correction.value) * 1000;

  timer.textContent =
    formatTime(correctionMs);

  if(animationId){
    cancelAnimationFrame(animationId);
  }

  animationId =
    requestAnimationFrame(draw);

  flash.classList.remove("active");

  void flash.offsetWidth;

  flash.classList.add("active");

}


/* =========================
   タッチ判定

   下部80pxでは
   絶対にスタートしない
========================= */

function canStartFromPoint(event){

  if(
    settings.classList.contains("open")
  ){
    return false;
  }

  if(
    event.target.closest("#adjustPanel") ||
    event.target.closest("#settingsButton")
  ){
    return false;
  }

  /*
    iPhone下部のホーム操作領域

    ここから上へスワイプしても
    QuickQを再スタートさせない
  */

  if(
    event.clientY >=
    window.innerHeight - NO_START_BOTTOM
  ){
    return false;
  }

  return true;

}


/* =========================
   最速 pointerdown
========================= */

document.addEventListener(
  "pointerdown",
  (event) => {

    if(
      !canStartFromPoint(event)
    ){
      return;
    }

    startImmediately();

  },
  {
    passive:true
  }
);


/* =========================
   古いiPhone用バックアップ
========================= */

document.addEventListener(
  "touchstart",
  (event) => {

    if(window.PointerEvent){
      return;
    }

    if(
      settings.classList.contains("open")
    ){
      return;
    }

    if(
      event.target.closest("#adjustPanel") ||
      event.target.closest("#settingsButton")
    ){
      return;
    }

    const touch =
      event.touches[0];

    if(!touch){
      return;
    }

    if(
      touch.clientY >=
      window.innerHeight - NO_START_BOTTOM
    ){
      return;
    }

    startImmediately();

  },
  {
    passive:true
  }
);


/* =========================
   補正
========================= */

function updateCorrection(){

  const value =
    Number(correction.value);

  if(value > 0){

    correctionValue.textContent =
      "+" + value.toFixed(1) + "秒";

  }
  else{

    correctionValue.textContent =
      value.toFixed(1) + "秒";

  }

  /*
    動作中なら補正変更を
    即座にタイマーへ反映
  */

  if(running){

    timer.textContent =
      formatTime(getElapsed());

  }

}

correction.addEventListener(
  "input",
  updateCorrection
);


[
  "pointerdown",
  "touchstart",
  "click"
].forEach(type => {

  adjustPanel.addEventListener(
    type,
    (event) => {

      event.stopPropagation();

    },
    {
      passive:true
    }
  );

});


/* =========================
   設定画面
========================= */

settingsButton.addEventListener(
  "pointerdown",
  (event) => {

    event.stopPropagation();

  }
);

settingsButton.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();

    settings.classList.add("open");

  }
);

closeSettings.addEventListener(
  "click",
  () => {

    settings.classList.remove("open");

  }
);


/* =========================
   設定保存
========================= */

function saveSetting(name,value){

  try{

    localStorage.setItem(
      "quickq_" + name,
      value
    );

  }
  catch(e){}

}


function loadSetting(name,fallback){

  try{

    return (
      localStorage.getItem(
        "quickq_" + name
      ) || fallback
    );

  }
  catch(e){

    return fallback;

  }

}


/* =========================
   サイズ
========================= */

function applySize(value){

  value =
    Math.max(
      70,
      Math.min(135,Number(value))
    );

  sizeSetting.value = value;

  sizeValue.textContent =
    value + "%";

  const vw =
    23 * (value / 100);

  timer.style.fontSize =
    "clamp(70px," +
    vw +
    "vw,230px)";

  preview.style.fontSize =
    (58 * value / 100) + "px";

  saveSetting("size",value);

}

sizeSetting.addEventListener(
  "input",
  () => {

    applySize(sizeSetting.value);

  }
);


/* =========================
   太さ
========================= */

function weightName(value){

  value = Number(value);

  if(value <= 300){
    return "細い";
  }

  if(value <= 500){
    return "標準";
  }

  if(value <= 700){
    return "太字";
  }

  return "極太";

}


function applyWeight(value){

  value =
    Math.max(
      300,
      Math.min(900,Number(value))
    );

  timer.style.fontWeight = value;
  preview.style.fontWeight = value;

  weightSetting.value = value;

  weightValue.textContent =
    weightName(value);

  saveSetting("weight",value);

}

weightSetting.addEventListener(
  "input",
  () => {

    applyWeight(
      weightSetting.value
    );

  }
);


/* =========================
   フォント
========================= */

const fontButtons =
  document.querySelectorAll(
    ".fontButton"
  );

function applyFont(font){

  timer.style.fontFamily = font;
  preview.style.fontFamily = font;

  fontButtons.forEach(button => {

    button.classList.toggle(
      "selected",
      button.dataset.font === font
    );

  });

  saveSetting("font",font);

}

fontButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      applyFont(
        button.dataset.font
      );

    }
  );

});


/* =========================
   色
========================= */

const colorButtons =
  document.querySelectorAll(
    ".colorButton"
  );

function applyColor(color){

  timer.style.color = color;
  preview.style.color = color;

  colorButtons.forEach(button => {

    button.classList.toggle(
      "selected",
      button.dataset.color === color
    );

  });

  saveSetting("color",color);

}

colorButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      applyColor(
        button.dataset.color
      );

    }
  );

});


/* =========================
   初期設定へ戻す
========================= */

document
.getElementById("resetSettings")
.addEventListener(
  "click",
  () => {

    applySize(100);
    applyWeight(700);

    applyFont(
      "Arial, sans-serif"
    );

    applyColor(
      "#ffffff"
    );

  }
);


/* =========================
   保存設定復元
========================= */

applySize(
  loadSetting("size","100")
);

applyWeight(
  loadSetting("weight","700")
);

applyFont(
  loadSetting(
    "font",
    "Arial, sans-serif"
  )
);

applyColor(
  loadSetting(
    "color",
    "#ffffff"
  )
);

updateCorrection();

timer.textContent =
  "00:00.0";


/* =========================
   他アプリから復帰

   バックグラウンド中に
   requestAnimationFrameが
   停止していても問題なし。

   Date.now()から正しい
   経過時間を再計算する。
========================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState === "visible"
    ){

      if(running){

        timer.textContent =
          formatTime(getElapsed());

        if(animationId){
          cancelAnimationFrame(animationId);
        }

        animationId =
          requestAnimationFrame(draw);

      }

    }
    else{

      /*
        バックグラウンドでは
        描画だけ停止。

        runningとstartRealTimeは
        そのまま保持する。
      */

      if(animationId){

        cancelAnimationFrame(
          animationId
        );

        animationId = null;

      }

    }

  }
);


/* =========================
   画面スリープ防止
========================= */

let wakeLock = null;

async function keepScreenAwake(){

  if(!("wakeLock" in navigator)){
    return;
  }

  try{

    if(
      wakeLock === null &&
      document.visibilityState === "visible"
    ){

      wakeLock =
        await navigator.wakeLock.request(
          "screen"
        );

      wakeLock.addEventListener(
        "release",
        () => {

          wakeLock = null;

        }
      );

    }

  }
  catch(error){

    wakeLock = null;

  }

}


/* 最初の操作でスリープ防止 */

document.addEventListener(
  "pointerdown",
  keepScreenAwake,
  {
    passive:true,
    once:true
  }
);


/* 復帰時にWake Lockも再取得 */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState === "visible"
    ){

      keepScreenAwake();

    }

  }
);


})();
</script>

</body>
</html>

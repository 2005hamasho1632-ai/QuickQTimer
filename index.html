<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>QuickQ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

body{
  position:relative;
  overscroll-behavior:none;
}

#app{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* =========================
   時計
========================= */

#clock{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:22px;
  font-size:17px;
  font-weight:600;
  color:#777;
  letter-spacing:.5px;
  z-index:30;
}

/* =========================
   設定
========================= */

#settingsButton{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  right:14px;
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:#151515;
  color:#aaa;
  font-size:27px;
  z-index:30;
  touch-action:manipulation;
}

/* =========================
   STARTエリア
========================= */

#startArea{
  position:absolute;

  top:max(
    78px,
    calc(env(safe-area-inset-top) + 62px)
  );

  left:8px;
  right:8px;

  bottom:max(
    245px,
    calc(env(safe-area-inset-bottom) + 220px)
  );

  border:2px solid #444;
  border-radius:18px;

  z-index:5;

  touch-action:manipulation;
}

#startArea::after{
  content:"START";

  position:absolute;
  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  color:#444;

  font-size:12px;
  font-weight:700;
  letter-spacing:3px;

  pointer-events:none;
}

/* =========================
   タイマー
========================= */

#timerArea{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#timer{
  font-family:Arial,sans-serif;

  font-size:clamp(
    82px,
    23vw,
    190px
  );

  font-weight:700;

  line-height:1;
  letter-spacing:-0.07em;

  color:#fff;

  white-space:nowrap;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  text-align:center;

  pointer-events:none;
}

/* =========================
   STOP
   STARTとは完全に独立
========================= */

#stopButton{
  position:absolute;

  left:50%;

  top:max(
    150px,
    calc(env(safe-area-inset-top) + 135px)
  );

  transform:translateX(-50%);

  width:138px;
  height:54px;

  border:2px solid #ff5050;
  border-radius:15px;

  background:#451313;
  color:#ff5757;

  font-size:19px;
  font-weight:800;
  letter-spacing:1px;

  z-index:40;

  touch-action:manipulation;
}

#stopButton:active{
  background:#8b2020;
  color:#fff;
}

/* =========================
   フラッシュ
========================= */

#flash{
  position:absolute;
  inset:0;

  background:rgba(255,255,255,.08);

  opacity:0;

  pointer-events:none;

  z-index:50;
}

#flash.active{
  animation:flash .10s ease-out;
}

@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* =========================
   補正パネル
========================= */

#adjustPanel{
  position:absolute;

  left:6%;
  right:6%;

  bottom:max(
    70px,
    calc(env(safe-area-inset-bottom) + 48px)
  );

  height:125px;

  z-index:20;

  touch-action:none;
}

#correctionValue{
  text-align:center;

  color:#aaa;

  font-size:24px;
  font-weight:600;

  margin-bottom:12px;
}

/* =========================
   スライダー
========================= */

.sliderWrap{
  position:relative;

  width:100%;
  height:52px;
}

/* スライダー本体 */

#correction{
  position:absolute;

  left:0;
  top:23px;

  width:100%;
  height:6px;

  margin:0;
  padding:0;

  appearance:none;
  -webkit-appearance:none;

  background:#666;

  border-radius:10px;

  outline:none;

  z-index:5;

  touch-action:none;
}

#correction::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:42px;
  height:42px;

  border-radius:50%;

  background:#fff;

  border:2px solid #aaa;

  box-shadow:0 0 0 1px #555;
}

/* =========================
   目盛り線
========================= */

.tick{
  position:absolute;

  top:11px;

  width:2px;
  height:30px;

  background:#777;

  transform:translateX(-50%);

  pointer-events:none;

  z-index:3;
}

.tick.minus20{
  left:16.6667%;
}

.tick.minus10{
  left:33.3333%;
}

.tick.zero{
  left:50%;

  width:3px;
  height:40px;

  top:6px;

  background:#fff;
}

.tick.plus10{
  left:66.6667%;
}

.tick.plus20{
  left:83.3333%;
}

/* =========================
   スライダー数字
========================= */

.sliderLabels{
  position:relative;

  width:100%;
  height:28px;

  margin-top:1px;

  color:#666;

  font-size:13px;
  font-weight:600;
}

.sliderLabels span{
  position:absolute;
  top:0;
  white-space:nowrap;
}

.labelM30{
  left:0;
}

.labelM20{
  left:16.6667%;
  transform:translateX(-50%);
}

.labelM10{
  left:33.3333%;
  transform:translateX(-50%);
}

.labelZero{
  left:50%;
  transform:translateX(-50%);

  color:#aaa;
  font-weight:800;
}

.labelP10{
  left:66.6667%;
  transform:translateX(-50%);
}

.labelP20{
  left:83.3333%;
  transform:translateX(-50%);
}

.labelP30{
  right:0;
}

/* =========================
   設定画面
========================= */

#settings{
  position:absolute;
  inset:0;

  background:rgba(0,0,0,.97);

  z-index:100;

  display:none;
  overflow:auto;

  padding:
    max(28px,env(safe-area-inset-top))
    22px
    max(30px,env(safe-area-inset-bottom));
}

#settings.open{
  display:block;
}

.settingsHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.settingsTitle{
  font-size:26px;
  font-weight:700;
}

#closeSettings{
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:28px;
}

.settingGroup{
  margin-bottom:28px;
}

.settingLabel{
  color:#999;
  font-size:15px;
  margin-bottom:10px;
}

.settingValue{
  color:#fff;
  font-size:20px;
  font-weight:600;
  margin-bottom:8px;
}

.settingRange{
  width:100%;
  height:6px;

  appearance:none;
  -webkit-appearance:none;

  background:#555;

  border-radius:8px;
}

.settingRange::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:34px;
  height:34px;

  border-radius:50%;

  background:#fff;
}

.fontGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.fontButton{
  min-height:56px;

  border:1px solid #333;
  border-radius:14px;

  background:#111;
  color:#bbb;

  font-size:18px;
}

.fontButton.selected{
  border:2px solid #fff;
  color:#fff;
  background:#222;
}

.colorGrid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.colorButton{
  width:52px;
  height:52px;

  border-radius:50%;

  border:3px solid transparent;
}

.colorButton.selected{
  border-color:#fff;
  transform:scale(1.12);
}

.white{background:#ffffff;}
.green{background:#39ff88;}
.red{background:#ff4b4b;}
.yellow{background:#ffe04b;}
.blue{background:#55aaff;}
.orange{background:#ff963f;}
.cyan{background:#45f4ff;}

#preview{
  margin-top:30px;

  padding:24px 5px;

  border-top:1px solid #222;
  border-bottom:1px solid #222;

  text-align:center;

  font-size:58px;
  font-weight:700;

  white-space:nowrap;

  font-variant-numeric:tabular-nums;
}

#resetSettings{
  width:100%;
  height:54px;

  margin-top:30px;

  border:1px solid #333;
  border-radius:14px;

  background:#111;
  color:#aaa;

  font-size:17px;
}

</style>
</head>


<body>

<div id="app">

  <div id="clock"></div>

  <button
    id="settingsButton"
    aria-label="設定">
    ⚙︎
  </button>


  <!-- START専用 -->

  <div id="startArea">

    <div id="timerArea">

      <div id="timer">
        00:00.0
      </div>

    </div>

  </div>


  <!-- STOPはSTARTの外 -->

  <button
    id="stopButton"
    type="button">
    ■ STOP
  </button>


  <!-- 補正 -->

  <div id="adjustPanel">

    <div id="correctionValue">
      0.0秒
    </div>


    <div class="sliderWrap">

      <div class="tick minus20"></div>
      <div class="tick minus10"></div>
      <div class="tick zero"></div>
      <div class="tick plus10"></div>
      <div class="tick plus20"></div>

      <input
        id="correction"
        type="range"
        min="-30"
        max="30"
        step="0.5"
        value="0"
      >

    </div>


    <div class="sliderLabels">

      <span class="labelM30">
        −30
      </span>

      <span class="labelM20">
        −20
      </span>

      <span class="labelM10">
        −10
      </span>

      <span class="labelZero">
        0
      </span>

      <span class="labelP10">
        +10
      </span>

      <span class="labelP20">
        +20
      </span>

      <span class="labelP30">
        +30
      </span>

    </div>

  </div>


  <div id="flash"></div>

</div>


<!-- =========================
     設定
========================= -->

<div id="settings">

  <div class="settingsHeader">

    <div class="settingsTitle">
      表示設定
    </div>

    <button id="closeSettings">
      ×
    </button>

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の大きさ
    </div>

    <div
      class="settingValue"
      id="sizeValue">
      100%
    </div>

    <input
      id="sizeSetting"
      class="settingRange"
      type="range"
      min="70"
      max="135"
      step="1"
      value="100"
    >

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の太さ
    </div>

    <div
      class="settingValue"
      id="weightValue">
      太字
    </div>

    <input
      id="weightSetting"
      class="settingRange"
      type="range"
      min="300"
      max="900"
      step="100"
      value="700"
    >

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      フォント
    </div>

    <div class="fontGrid">

      <button
        class="fontButton selected"
        data-font="Arial, sans-serif">
        ABC 123
      </button>

      <button
        class="fontButton"
        data-font="'Arial Black', Arial, sans-serif"
        style="font-family:'Arial Black',Arial,sans-serif">
        ABC 123
      </button>

      <button
        class="fontButton"
        data-font="'Courier New', monospace"
        style="font-family:'Courier New',monospace">
        00:12.3
      </button>

      <button
        class="fontButton"
        data-font="-apple-system, BlinkMacSystemFont, sans-serif">
        iPhone
      </button>

    </div>

  </div>


  <div class="settingGroup">

    <div class="settingLabel">
      数字の色
    </div>

    <div class="colorGrid">

      <button
        class="colorButton white selected"
        data-color="#ffffff">
      </button>

      <button
        class="colorButton green"
        data-color="#39ff88">
      </button>

      <button
        class="colorButton red"
        data-color="#ff4b4b">
      </button>

      <button
        class="colorButton yellow"
        data-color="#ffe04b">
      </button>

      <button
        class="colorButton blue"
        data-color="#55aaff">
      </button>

      <button
        class="colorButton orange"
        data-color="#ff963f">
      </button>

      <button
        class="colorButton cyan"
        data-color="#45f4ff">
      </button>

    </div>

  </div>


  <div id="preview">
    00:12.3
  </div>


  <button id="resetSettings">
    表示設定を初期状態に戻す
  </button>

</div>


<script>
(() => {

/* =========================
   要素
========================= */

const timer =
  document.getElementById("timer");

const

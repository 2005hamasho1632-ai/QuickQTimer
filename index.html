<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>QuickQ</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

body{
  position:fixed;
  inset:0;
}

/* 全画面 */

#app{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:
    env(safe-area-inset-top)
    18px
    calc(env(safe-area-inset-bottom) + 20px);
}

/* 現在時刻 */

#clock{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 12px);
  right:22px;

  font-size:18px;
  font-weight:500;
  letter-spacing:1px;

  color:#777;
}

/* メインタイマー */

#timer{
  width:100%;
  text-align:center;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  font-size:clamp(74px,22vw,150px);
  font-weight:300;
  letter-spacing:-5px;
  line-height:1;

  white-space:nowrap;

  transform:translateY(-4vh);
}

/* 初回だけ表示 */

#guide{
  position:absolute;
  top:67%;

  font-size:15px;
  font-weight:500;
  letter-spacing:3px;

  color:#555;

  transition:opacity .15s ease;
}

#guide.hide{
  opacity:0;
}

/* 補正 */

#adjustPanel{
  position:absolute;

  left:24px;
  right:24px;

  bottom:calc(env(safe-area-inset-bottom) + 25px);

  padding:14px 16px 8px;

  border-radius:18px;

  background:rgba(255,255,255,.045);
}

.adjustTop{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;

  font-size:13px;
  color:#777;
}

#correctionValue{
  font-variant-numeric:tabular-nums;
  color:#aaa;
  font-size:15px;
}

/* スライダー */

#correction{
  width:100%;
  height:34px;

  margin:0;

  accent-color:#fff;
}

/* タップした瞬間の視覚フィードバック */

#flash{
  position:fixed;
  inset:0;

  pointer-events:none;

  background:#fff;
  opacity:0;

  transition:opacity 80ms ease;
}

#flash.active{
  opacity:.075;
}

</style>
</head>

<body>

<div id="app">

  <div id="clock"></div>

  <div id="timer">00:00.0</div>

  <div id="guide">TAP TO START</div>

  <div id="adjustPanel">

    <div class="adjustTop">
      <span>補正</span>
      <span id="correctionValue">±0.0 秒</span>
    </div>

    <input
      id="correction"
      type="range"
      min="-20"
      max="20"
      step="0.1"
      value="0"
    >

  </div>

</div>

<div id="flash"></div>

<script>

(() => {

  const timer =
    document.getElementById("timer");

  const clock =
    document.getElementById("clock");

  const guide =
    document.getElementById("guide");

  const correction =
    document.getElementById("correction");

  const correctionValue =
    document.getElementById("correctionValue");

  const adjustPanel =
    document.getElementById("adjustPanel");

  const flash =
    document.getElementById("flash");


  let running = false;

  let startTime = 0;

  let correctionMs = 0;

  let animationId = null;


  /* =========================
     現在時刻
  ========================= */

  function updateClock(){

    const now = new Date();

    const h =
      String(now.getHours())
      .padStart(2,"0");

    const m =
      String(now.getMinutes())
      .padStart(2,"0");

    const s =
      String(now.getSeconds())
      .padStart(2,"0");

    clock.textContent =
      `${h}:${m}:${s}`;

  }

  updateClock();

  setInterval(updateClock,250);


  /* =========================
     時間表示
  ========================= */

  function formatTime(ms){

    ms = Math.max(0,ms);

    const totalTenths =
      Math.floor(ms / 100);

    const minutes =
      Math.floor(totalTenths / 600);

    const seconds =
      Math.floor(
        (totalTenths % 600) / 10
      );

    const tenth =
      totalTenths % 10;

    return (
      String(minutes).padStart(2,"0")
      + ":"
      + String(seconds).padStart(2,"0")
      + "."
      + tenth
    );

  }


  /* =========================
     タイマー更新
  ========================= */

  function draw(now){

    if(!running){
      return;
    }

    const elapsed =
      now - startTime + correctionMs;

    timer.textContent =
      formatTime(elapsed);

    animationId =
      requestAnimationFrame(draw);

  }


  /* =========================
     スタート / 再スタート
  ========================= */

  function restart(){

    startTime =
      performance.now();

    running = true;

    timer.textContent =
      formatTime(correctionMs);

    guide.classList.add("hide");

    if(animationId){
      cancelAnimationFrame(animationId);
    }

    animationId =
      requestAnimationFrame(draw);


    /* タップ確認 */

    flash.classList.add("active");

    setTimeout(() => {
      flash.classList.remove("active");
    },70);

  }


  /* =========================
     補正
  ========================= */

  function updateCorrection(){

    const value =
      Number(correction.value);

    correctionMs =
      value * 1000;

    if(value > 0){

      correctionValue.textContent =
        "+" + value.toFixed(1) + " 秒";

    }
    else if(value < 0){

      correctionValue.textContent =
        value.toFixed(1) + " 秒";

    }
    else{

      correctionValue.textContent =
        "±0.0 秒";

    }


    if(!running){

      timer.textContent =
        formatTime(
          Math.max(0,correctionMs)
        );

    }

  }


  correction.addEventListener(
    "input",
    updateCorrection
  );


  /* =========================
     補正部分では
     タイマーを再スタートさせない
  ========================= */

  adjustPanel.addEventListener(
    "pointerdown",
    (event) => {

      event.stopPropagation();

    }
  );

  adjustPanel.addEventListener(
    "click",
    (event) => {

      event.stopPropagation();

    }
  );


  /* =========================
     画面のどこを押しても
     即座に 0 から再スタート
  ========================= */

  document.addEventListener(
    "pointerdown",
    (event) => {

      if(
        event.target.closest("#adjustPanel")
      ){
        return;
      }

      restart();

    },
    {passive:true}
  );


  /* =========================
     初期化
  ========================= */

  updateCorrection();

  timer.textContent =
    "00:00.0";

})();

</script>

</body>
</html>

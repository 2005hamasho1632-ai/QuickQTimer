<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>QuickQTimer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
              "Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  min-height:100dvh;
}

#app{
  min-height:100dvh;
  padding:
    max(16px,env(safe-area-inset-top))
    18px
    max(18px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}

/* 上部 */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:34px;
  color:#888;
  font-size:14px;
  letter-spacing:.04em;
}

.name{
  font-weight:600;
}

.clock{
  font-variant-numeric:tabular-nums;
}

/* メインタイマー */
.timerArea{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:0;
}

#timer{
  width:100%;
  text-align:center;
  font-size:clamp(72px,22vw,150px);
  line-height:.9;
  font-weight:700;
  letter-spacing:-.07em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* 動作中の小さな表示 */
#status{
  height:28px;
  margin-top:24px;
  font-size:15px;
  letter-spacing:.18em;
  color:#666;
}

#status.running{
  color:#fff;
}

/* 下部操作 */
.controls{
  width:100%;
}

.adjustRow{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.adjustLabel{
  color:#777;
  font-size:13px;
  white-space:nowrap;
}

#offsetText{
  color:#aaa;
  font-size:13px;
  min-width:54px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

input[type=range]{
  flex:1;
  height:28px;
  background:transparent;
  appearance:none;
  -webkit-appearance:none;
}

input[type=range]::-webkit-slider-runnable-track{
  height:3px;
  border-radius:3px;
  background:#444;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:22px;
  height:22px;
  margin-top:-9.5px;
  border-radius:50%;
  background:#fff;
}

.startZone{
  width:100%;
  height:105px;
  border:1px solid #444;
  border-radius:22px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-size:20px;
  font-weight:600;
  letter-spacing:.05em;
  user-select:none;
  -webkit-user-select:none;
}

.startZone:active{
  background:#151515;
}

.startSmall{
  display:block;
  margin-top:7px;
  text-align:center;
  color:#666;
  font-size:11px;
  font-weight:400;
  letter-spacing:.12em;
}

/* 横画面 */
@media (orientation:landscape){
  #app{
    padding:12px 28px;
  }

  .top{
    min-height:24px;
  }

  #timer{
    font-size:min(22vh,18vw);
  }

  #status{
    margin-top:12px;
  }

  .adjustRow{
    margin-bottom:10px;
  }

  .startZone{
    height:62px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="top">
    <div class="name">QUICK Q TIMER</div>
    <div id="clock" class="clock">--:--:--</div>
  </div>

  <div class="timerArea">
    <div id="timer">00:00.0</div>
    <div id="status">READY</div>
  </div>

  <div class="controls">

    <div class="adjustRow">
      <div class="adjustLabel">補正</div>

      <input
        id="offset"
        type="range"
        min="-300"
        max="300"
        value="0"
        step="1">

      <div id="offsetText">0.0秒</div>
    </div>

    <div id="startZone" class="startZone">
      <div>
        TAP → 0:00 START
        <span class="startSmall">タップするたび 0:00 から再スタート</span>
      </div>
    </div>

  </div>

</div>

<script>
const timerEl   = document.getElementById("timer");
const clockEl   = document.getElementById("clock");
const statusEl  = document.getElementById("status");
const startZone = document.getElementById("startZone");
const offset    = document.getElementById("offset");
const offsetTxt = document.getElementById("offsetText");

let running = false;
let startTime = 0;
let offsetMs = 0;

/* 現在時刻 */
function updateClock(){
  const d = new Date();

  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  const s = String(d.getSeconds()).padStart(2,"0");

  clockEl.textContent = `${h}:${m}:${s}`;
}

setInterval(updateClock,250);
updateClock();

/* 補正 */
offset.addEventListener("input",()=>{
  offsetMs = Number(offset.value) * 10;

  const sec = offsetMs / 1000;

  offsetTxt.textContent =
    (sec > 0 ? "+" : "") + sec.toFixed(1) + "秒";
});

/* 0からスタート／再スタート */
function startFromZero(){

  startTime = performance.now();
  running = true;

  statusEl.textContent = "RUNNING";
  statusEl.classList.add("running");

  if(navigator.vibrate){
    navigator.vibrate(20);
  }
}

startZone.addEventListener("click",startFromZero);

/* タイマー描画 */
function render(){

  if(running){

    let elapsed =
      performance.now() -
      startTime +
      offsetMs;

    if(elapsed < 0){
      elapsed = 0;
    }

    const totalTenths =
      Math.floor(elapsed / 100);

    const minutes =
      Math.floor(totalTenths / 600);

    const seconds =
      Math.floor((totalTenths % 600) / 10);

    const tenth =
      totalTenths % 10;

    timerEl.textContent =
      String(minutes).padStart(2,"0") +
      ":" +
      String(seconds).padStart(2,"0") +
      "." +
      tenth;
  }

  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
